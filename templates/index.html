{% extends "base.html" %}

{% block content %}

<div class="hero">
    <h1 class="titulo-central titulo-principal">GameVerse</h1>
    <p class="hero-subtitulo">Encontre, cadastre e organize sua coleção de jogos.</p>
</div>

<form method="GET" action="/" class="form-busca">

    <div class="barra-acoes">
        <div class="campo-busca">
            <span class="icone-busca">⌕</span>
            <input
                type="text"
                name="nome"
                placeholder="Pesquisar por nome..."
                value="{{ request.args.get('nome', '') }}"
                autocomplete="off"
            >
        </div>

        <button type="button" id="abrir-filtros" class="btn btn-secundario">
            <span class="icone-filtro">▤</span> Filtros
            {% if request.args.get('genero') or request.args.get('categoria') or request.args.get('classificacao') or request.args.get('ano') %}
            <span class="badge-ativo"></span>
            {% endif %}
        </button>

        <button
            type="button"
            class="btn btn-cadastrar abrir-painel-formulario"
            data-url="{{ url_for('cadastrar') }}"
        >+ Cadastrar Jogo</button>
    </div>

    <aside id="sidebar-filtros" class="painel-lateral">

        <div class="sidebar-topo">
            <span class="painel-titulo">Filtros</span>
            <button type="button" id="fechar-filtros" class="link-voltar">← Voltar</button>
        </div>

        <div class="campo">
            <label for="filtro-genero">Gênero</label>
            <select id="filtro-genero" name="genero">
                <option value="">Todos os gêneros</option>
                {% for g in generos %}
                <option value="{{ g.nome }}" {% if request.args.get('genero') == g.nome %}selected{% endif %}>{{ g.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="filtro-categoria">Categoria</label>
            <select id="filtro-categoria" name="categoria">
                <option value="">Todas as categorias</option>
                {% for c in categorias %}
                <option value="{{ c.nome }}" {% if request.args.get('categoria') == c.nome %}selected{% endif %}>{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="filtro-classificacao">Classificação</label>
            <select id="filtro-classificacao" name="classificacao">
                <option value="">Qualquer classificação</option>
                {% for cl in classificacoes %}
                <option value="{{ cl }}" {% if request.args.get('classificacao') == cl %}selected{% endif %}>{{ cl }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="filtro-ano">Ano</label>
            <input
                type="number"
                id="filtro-ano"
                name="ano"
                placeholder="Ex: 2021"
                value="{{ request.args.get('ano', '') }}"
                min="1970"
                max="{{ ano_atual }}"
                step="1"
                oninput="if(this.value.length > 4) this.value = this.value.slice(0,4)"
            >
        </div>

        <button type="submit">Aplicar filtros</button>

        {% if request.args %}
        <a href="/" class="limpar-link">Limpar filtros</a>
        {% endif %}

    </aside>

</form>

{% include "_resultados.html" %}

{% endblock %}
